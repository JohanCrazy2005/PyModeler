[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pymodeler"
version = "0.1.0"
description = "Cross-platform 3D modeling software with PyQt6 and JSON schemas"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "PyModeler Contributors" }]
dependencies = [
    "PyQt6>=6.6.0",
    "numpy>=1.24.0",
    "jsonschema>=4.20.0",
    "trimesh>=4.0.0",
    "ezdxf>=1.0.0",
    "moderngl>=5.8.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4.0", "pytest-qt>=4.2.0"]

[project.scripts]
pymodeler = "pymodeler.ui.main_window:run_app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
